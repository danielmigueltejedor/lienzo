[package]
name = "lienzo-algo"
description = "Depth-agnostic, tile-aware CPU image filters (blur, sharpen, noise, distort, stylize)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
lienzo-geom = { workspace = true }
lienzo-color = { workspace = true }
lienzo-raster = { workspace = true }
serde = { workspace = true }
rustfft = "6.4.1"

# Parallel tiles on native; wasm builds stay single-threaded.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
lienzo-testkit = { workspace = true }
serde_json = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "blur"
harness = false

[package]
name = "lienzo-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
craft-print = { workspace = true }
craft-ui = { workspace = true }
lienzo-geom = { workspace = true }
lienzo-color = { workspace = true }
lienzo-cms = { workspace = true }
lienzo-raster = { workspace = true }
lienzo-doc = { workspace = true }
lienzo-compose = { workspace = true }
lienzo-gpu = { workspace = true }
lienzo-engine = { workspace = true }
lienzo-io = { workspace = true }
lienzo-plugins = { workspace = true }
lienzo-algo = { workspace = true }
lienzo-text = { workspace = true }
lienzo-vector = { workspace = true }
# Only MAX_BRUSH_SIZE: `ui.set brushSize` validates against the Brush Settings range up front.
lienzo-paint = { workspace = true }
# Reading files to open them (bounded reads, a clear error for files larger than memory).
lienzo-format = { workspace = true }
# Decoding the brand mark's PNG (`brand.rs`); already linked through lienzo-io.
lienzo-codecs = { workspace = true }
# Reading embedded thumbnail resources (1036/1033) for recent files in Home screen.
lienzo-psd = { workspace = true }
egui = { workspace = true }
nodalia-theme = { workspace = true, features = ["creator"] }
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
eframe = { workspace = true, features = ["wgpu", "accesskit", "clipboard"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# Display order of right-to-left labels (`bidi_text.rs`); already linked through usvg.
unicode-bidi = "0.3"
# Context-sensitive dotted/dotless I mapping for Azerbaijani and Turkish UI text.
icu_casemap = "2.3"
icu_locale_core = "2.3"
base64 = "0.23"
# Inflating the translation catalogs, stored deflated (build.rs); already linked through lienzo-io.
flate2 = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Floating panels open in their own OS windows on the desktop; the web keeps them in the page.
craft-ui = { workspace = true, features = ["native-windows"] }
nodalia-update = { workspace = true }
rayon = { workspace = true }
# Safe native UI-language APIs (Windows/macOS); no subprocess or web dependency.
sys-locale = "=0.3.2"

# Installed RAM for the GPU memory budget (`gpu_canvas::physical_memory`) and the user's decimal
# symbol (`i18n::decimal_separator`, a registry read): the safe binding the desktop app already
# uses, pinned to the same version.
[target.'cfg(target_os = "windows")'.dependencies]
winsafe = { version = "=0.0.29", default-features = false, features = ["kernel", "dxgi", "advapi"] }

[dev-dependencies]
lienzo-io = { workspace = true, features = ["testgen"] }
# egui's own default fonts in tests: the oracle for egui_fonts.rs, and contexts made with
# `Context::default()` (no install_fonts) can lay out text.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
# Synthetic raw files for the open-time Camera Raw dialog tests.
lienzo-raw = { workspace = true, features = ["testgen"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot", "eframe"] }
# Benchmark helpers for the `--json` benches `cargo xtask perf` runs (in-process RSS, percentiles).
lienzo-testkit = { workspace = true }
# examples/perf_scenarios.rs (a 500-brush .abr for the #210 import row) and large_file_bench.rs
# (the generated 2 GB PSD and 4.4 GB PSB of P20, `fixtures`).
lienzo-psd = { workspace = true, features = ["testgen"] }
# Isolated, self-cleaning folders for filesystem tests (the LUT folder, #6558).
tempfile = "3"

[build-dependencies]
# Deflates the translation catalogs and egui's default fonts (build.rs); already linked at run time to inflate them.
flate2 = { workspace = true }
# egui's default fonts, deflated by build.rs for egui_fonts.rs (the same version egui uses).
epaint_default_fonts = { version = "0.37", features = ["monochrome_emoji_fonts"] }

[[example]]
name = "flat_open_bench"
test = true

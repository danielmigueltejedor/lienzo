# Vendored from storytold/craft-libs at 1b34eba41e62138fc2438d2734523b302840b45d (crates/ui), with one
# change: a floating window can have rounded corners (`DockStyle::floating_radius`). See VENDORED.md.
[package]
name = "craft-ui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/getnodalia/foundation"
rust-version = "1.95"
description = "Reusable egui controls and icon catalogs for Craft frontends"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(craft_pdf_unicode_fixtures)"] }

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[dependencies]
craft-fonts-build = { git = "https://github.com/getnodalia/foundation", rev = "1b34eba41e62138fc2438d2734523b302840b45d" }
craft-i18n = { git = "https://github.com/getnodalia/foundation", rev = "1b34eba41e62138fc2438d2734523b302840b45d" }
egui = { version = "0.37", default-features = false }
epaint = { version = "0.37", default-features = false }
log = "0.4"
serde = { version = "1", features = ["derive"], optional = true }
skrifa = { version = "0.44", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui_kittest = { version = "0.37", features = ["snapshot", "wgpu"], optional = true }
fontique = { version = "0.11.1", default-features = false, features = ["system", "fontconfig-dlopen"], optional = true }
unicode-script = { version = "0.5.8", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "RequestInit", "Response", "console"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSEvent", "NSResponder", "NSScreen", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSString"] }

[features]
default = []
serde = ["dep:serde"]
native-windows = []
color_fonts = ["epaint/color_fonts"]
system_fonts = ["dep:fontique", "dep:unicode-script"]
testing = []
screen-testing = ["dep:egui_kittest"]

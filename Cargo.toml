[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/lienzo", "apps/lienzo-cli", "xtask"]
exclude = ["vendor/craft-ui"]

[workspace.package]
version = "0.3.5"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
craft-ui = { git = "https://github.com/getnodalia/foundation", rev = "1b34eba41e62138fc2438d2734523b302840b45d", features = ["serde"] }
# Nodalia Design Language tokens (no features: no egui of its own, so the patched egui stays the only one).
nodalia-theme = { git = "https://github.com/danielmigueltejedor/nodalia-design", rev = "6d94e9c17c1767260bcb020f00c71eddd105561f" }
# internal
lienzo-geom = { path = "crates/geom" }
lienzo-color = { path = "crates/color" }
lienzo-cms = { path = "crates/cms" }
lienzo-raster = { path = "crates/raster" }
lienzo-doc = { path = "crates/doc" }
lienzo-ops = { path = "crates/ops" }
lienzo-psd = { path = "crates/psd" }
lienzo-codecs = { path = "crates/codecs" }
lienzo-raw = { path = "crates/raw" }
lienzo-affinity = { path = "crates/affinity" }
lienzo-compose = { path = "crates/compose" }
lienzo-gpu = { path = "crates/gpu" }
lienzo-paint = { path = "crates/paint" }
lienzo-algo = { path = "crates/algo" }
lienzo-io = { path = "crates/io" }
lienzo-text = { path = "crates/text" }
lienzo-vector = { path = "crates/vector" }
lienzo-format = { path = "crates/format" }
lienzo-automation = { path = "crates/automation" }
lienzo-plugins = { path = "crates/plugins" }
lienzo-engine = { path = "crates/engine" }
lienzo-ui-egui = { path = "crates/ui-egui" }
lienzo-testkit = { path = "crates/testkit" }
lienzo-tablet = { path = "crates/tablet" }
lienzo-ipp = { path = "crates/ipp" }

# external
craft-print = { git = "https://github.com/getnodalia/foundation", rev = "1b34eba41e62138fc2438d2734523b302840b45d" }
craft-pdf = { git = "https://github.com/getnodalia/foundation", rev = "1b34eba41e62138fc2438d2734523b302840b45d", features = ["raster"] }
craft-docpath = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "1b34eba41e62138fc2438d2734523b302840b45d" }
craft-jpeg = { git = "https://github.com/getnodalia/foundation", rev = "1b34eba41e62138fc2438d2734523b302840b45d" }
craft-pcraft-format = { git = "https://github.com/getnodalia/foundation", rev = "b8f7d93b00dfb8f172938f3d2d796ae62dcfe123" }
# In-app updates (check GitHub Releases, verify, replace the AppImage or the macOS app, restart).
nodalia-update = { git = "https://github.com/danielmigueltejedor/nodalia-design", rev = "17c2912f46b898940b263e315d2b191f3e0aad17", features = ["egui"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4.6.11"
clap_mangen = { version = "0.3.3", features = ["env"] }
arc-swap = "1"
bytemuck = { version = "1", features = ["derive"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
encoding_rs = { version = "0.8", default-features = false, features = ["alloc"] }
image = { version = "0.25", default-features = false }
# Baseline-JPEG decode of lossy DNG tiles (compression 34892), shared with zune-jpeg.
zune-core = "0.5"
zune-jpeg = "0.5"
proptest = "1"
eframe = { version = "0.37", default-features = false }
# Without `default_fonts`, which embeds egui's fonts uncompressed: ui-egui ships them deflated
# (egui_fonts.rs; the web build's size gate).
egui = { version = "0.37", default-features = false }
egui_kittest = "0.37"
rfd = "0.17"
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rayon = "1"
rustc-hash = "2.1.3"
criterion = { version = "0.8", default-features = false }
getrandom = "0.3"
# Monotonic clock on native and wasm (screenshot deadlines: a wall clock can jump).
web-time = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

# Dependencies carry no debug info: their frames in a backtrace lose file:line, and the target dir
# and link times shrink. The test profile inherits both settings.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
# Line tables keep file:line in panic backtraces but drop variable info, which roughly halves link
# time and PDB size for the test binaries (#2204). CI's Windows legs build with no debuginfo at all
# (CARGO_PROFILE_DEV_DEBUG=0). To inspect locals in a debugger, build with
# CARGO_PROFILE_DEV_DEBUG=true.
debug = "line-tables-only"

# Test builds compile ui-egui without optimization: its library and unit tests were the biggest
# test-build units after engine's (12.6 of ~63 compile minutes on the Windows CI runner), and its
# tests run no heavier pixel code of their own (that lives in the crates that stay optimized).
# Measured on CI: Windows build 18.9 -> 15.4 min, test run 10.0 -> 10.5. `cargo run` and
# `cargo build` use the dev profile and are unaffected.
[profile.test.package.lienzo-ui-egui]
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1

# The browser build (apps/lienzo-web, `data-cargo-profile` in its index.html). Hosts cap the
# size of a single file (Cloudflare Pages/Workers: 25 MiB), and the wasm is downloaded on every
# visit, so this profile optimizes for size: fat LTO, opt-level "z" for Lienzo's own crates,
# "s" for dependencies and for the crates that decode files, and 3 for pixel processing (filters
# and compositing). Dependencies stay at "s": at "z" the whole wasm grows (by 0.4 MB, measured).
# panic stays the target default (wasm32-unknown-unknown aborts; AGENTS.md's `panic = "unwind"`
# is for the native app shell). packaging/web/package.sh fails the build above 24 MiB.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.wasm-release.package."*"]
opt-level = "s"

# Decoding and rasterizing keep their speed.
[profile.wasm-release.package.lienzo-codecs]
opt-level = "s"
[profile.wasm-release.package.lienzo-raw]
opt-level = "s"
[profile.wasm-release.package.lienzo-heif]
opt-level = "s"
[profile.wasm-release.package.lienzo-vector]
opt-level = "s"

# Large crates off the per-frame and per-pixel paths: the document model, file parsers run once
# per open/save, JSON (settings, presets, control channel), SVG parsing, and shader translation
# (runs when a pipeline is created). "z" keeps the wasm well under the size gate.
[profile.wasm-release.package.lienzo-doc]
opt-level = "z"
[profile.wasm-release.package.lienzo-psd]
opt-level = "z"
[profile.wasm-release.package.lienzo-format]
opt-level = "z"
[profile.wasm-release.package.lienzo-affinity]
opt-level = "z"
[profile.wasm-release.package.serde_json]
opt-level = "z"
[profile.wasm-release.package.usvg]
opt-level = "z"
[profile.wasm-release.package.naga]
opt-level = "z"

# The browser UI toolkit favors size to stay within the WebAssembly upload budget.
[profile.wasm-release.package.egui]
opt-level = "z"
[profile.wasm-release.package.epaint]
opt-level = "z"
[profile.wasm-release.package.eframe]
opt-level = "z"

# Pixel processing keeps its speed-oriented optimization level, with two exceptions.
# Colour-management transforms are built once and cached (`transform::cached`), so "z" costs
# little runtime. The browser app composites per frame on the GPU (`crates/gpu`, WebGPU/WebGL2),
# so the CPU compositor is not the browser's hot path there; "z" for compose keeps the wasm
# under the 24 MiB gate (measured −122 KB vs opt-level 3). algo's filters run per pixel on
# every interactive filter application; "z" there is the size lever of last resort (−331 KB),
# taken because the gate is enforced in CI: if browser filters feel too slow, restore 3 here
# and reclaim the bytes from a feature-gated decoder instead.
[profile.wasm-release.package.lienzo-raster]
opt-level = 3
[profile.wasm-release.package.lienzo-color]
opt-level = 3
[profile.wasm-release.package.lienzo-cms]
opt-level = "z"
[profile.wasm-release.package.lienzo-compose]
opt-level = "z"
[profile.wasm-release.package.lienzo-algo]
opt-level = "z"
[profile.wasm-release.package.lienzo-paint]
opt-level = 3

# Keep the complete egui family and native event bridge on reviewed fork commits.
[patch.crates-io]
ecolor = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_system_font_provider = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_demo_lib = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_inspection = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/getnodalia/foundation", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
# craft-pdf's vendored Hayro trees: consumers patch the same craft-libs revision (crates/pdf README).
hayro = { git = "https://github.com/getnodalia/foundation", rev = "1b34eba41e62138fc2438d2734523b302840b45d" }
hayro-syntax = { git = "https://github.com/getnodalia/foundation", rev = "1b34eba41e62138fc2438d2734523b302840b45d" }
hayro-interpret = { git = "https://github.com/getnodalia/foundation", rev = "1b34eba41e62138fc2438d2734523b302840b45d" }
hayro-jbig2 = { git = "https://github.com/getnodalia/foundation", rev = "1b34eba41e62138fc2438d2734523b302840b45d" }

# craft-ui is vendored (vendor/craft-ui, see vendor/craft-ui/VENDORED.md) so that a floating window
# can have rounded corners; every craft-libs crate that depends on it gets this copy.
[patch."https://github.com/getnodalia/foundation"]
craft-ui = { path = "vendor/craft-ui" }

# craft-libs at the pinned revisions names winprint.rs by its old home; resolve it from foundation,
# where the same commits are kept (vendor/winprint.rs/main).
[patch."https://github.com/storytold/winprint.rs"]
craft-winprint-gdi = { git = "https://github.com/getnodalia/foundation", rev = "64e7afd4d1483512385012c340ecaaaf0f3beb7f" }
winprint = { git = "https://github.com/getnodalia/foundation", rev = "51934db382f225454cf152a8657eb03789be63c4" }

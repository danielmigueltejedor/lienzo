[package]
name = "photocraft"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "lienzo"
description = "Photocraft: an open-source, native image editor"
build = "build.rs"

autobins = false

[[bin]]
name = "lienzo"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
photocraft-doc = { workspace = true }
photocraft-color = { workspace = true }
photocraft-raster = { workspace = true }
photocraft-geom = { workspace = true }
photocraft-compose = { workspace = true }
photocraft-engine = { workspace = true }
photocraft-codecs = { workspace = true }
photocraft-io = { workspace = true }
photocraft-format = { workspace = true }
photocraft-automation = { workspace = true }
photocraft-ui-egui = { workspace = true }
# Pen tablet pressure/tilt on macOS and X11 (the workspace's one isolated unsafe helper crate).
photocraft-tablet = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }
arboard = { version = "3", features = ["wayland-data-control"] }
open = "5"

[features]
# Real GNOME caption buttons, rendered by GTK/libadwaita (the shell's own widgets).
# Off by default so builds without the GTK 4 / libadwaita headers still succeed.
gnome-captions = ["dep:gtk4", "dep:libadwaita"]

[target.'cfg(all(target_os = "linux", not(target_arch = "wasm32")))'.dependencies]
# 0.9/0.7 match a consistent gtk4-sys. Newer gtk4 0.11.5 does not compile against the
# gtk4-sys it resolves (missing GTK_EDITABLE_PROP_INPUT_INTERCEPTOR).
gtk4 = { version = "=0.9.7", optional = true }
libadwaita = { version = "=0.7.2", optional = true, features = ["v1_4"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Finder double-click / Open With / Dock drops arrive as Apple events; this small audited crate
# registers the handler (Objective-C interop needs unsafe, which our workspace forbids) behind a
# safe API. Pinned exactly: review the diff before bumping.
fmv-macos-events = "=0.1.0"

[build-dependencies]
# Icon + VERSIONINFO for photocraft.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

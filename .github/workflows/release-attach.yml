name: Release attach

# Attaches the packages a release run already built and tested to its release, when that run's own
# attach step could not: for example, the release was published before the slow platform finished.
# Run it by hand with the tag, the run's id and the artifact name (lienzo-macos, lienzo-windows or
# lienzo-linux). It only adds files the release does not have yet, and only from a run built from
# the commit the tag points at, so nothing people already downloaded is ever replaced.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.3.2"
        required: true
      run-id:
        description: "Id of the release run that built the packages"
        required: true
      artifact:
        description: "Artifact of that run to attach"
        required: true
        type: choice
        options: [lienzo-macos, lienzo-windows, lienzo-linux]

permissions:
  contents: read

concurrency:
  group: release-attach-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  attach:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: The run built the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.run-id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::run-id must be a number"; exit 1; }
          tagged="$(gh api "repos/$REPO/commits/$TAG" --jq .sha)"
          built="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .head_sha)"
          if [[ "$tagged" != "$built" ]]; then
            echo "::error::Run $RUN_ID built $built, but $TAG is $tagged."
            exit 1
          fi
          echo "Run $RUN_ID built $built, the commit $TAG points at."

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact }}
          path: dist
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}

      - name: Add the files the release is missing
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.run-id }}
        working-directory: dist
        run: |
          set -euo pipefail
          sums=""
          for f in SHA256SUMS*; do
            if [[ -e "$f" ]]; then sums="$f"; break; fi
          done
          [[ -n "$sums" ]] && sha256sum -c "$sums"
          have="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')"
          added=0
          for f in *; do
            if grep -qxF "$f" <<<"$have"; then
              echo "$f is already on $TAG: left as it is."
            else
              gh release upload "$TAG" "$f" --repo "$REPO"
              echo "Added $f"
              added=$((added + 1))
            fi
          done
          echo "### $TAG: $added file(s) added from run $RUN_ID" >>"$GITHUB_STEP_SUMMARY"

name: lienzo-engine

on:
  pull_request:
  push:
    paths:
      - "engine/**"
      - ".github/workflows/lienzo-engine.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the Rust engine boundary
        working-directory: engine
        run: cargo test -p lienzo-engine

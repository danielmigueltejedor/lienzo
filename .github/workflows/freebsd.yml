# Builds and tests the workspace on FreeBSD, inside a FreeBSD VM on a Linux runner
# (GitHub has no FreeBSD runners). GPU tests skip themselves when the VM has no adapter.
# It then runs packaging/freebsd/package.sh, the script the release job runs, and checks the
# tarball, so a broken FreeBSD package fails here before it can fail a release. Nothing is
# uploaded and no secrets are used.
name: FreeBSD

# The VM build takes one to several hours, so it runs nightly on main rather than on every push
# or dependency change: a drifted dependency still shows up within a day. PRs that change the
# FreeBSD packaging itself still run it.
on:
  push:
    branches: [release]
  schedule:
    - cron: "17 2 * * *"
  pull_request:
    paths:
      - .github/workflows/freebsd.yml
      - packaging/freebsd/**
      - packaging/env.sh
  workflow_dispatch:

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freebsd:
    uses: getnodalia/foundation/.github/workflows/freebsd.yml@ec62c63fd3206e4ed729fccf18a57170f8fa5dd6 # foundation main
    with:
      # FreeBSD 15.0's package repository now contains binaries requiring a newer libc than the
      # VM image. 15.1 keeps the base system and packages on the same ABI.
      release: "15.1"
      fonts-repository: getnodalia/foundation
      fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      # The VM's software Vulkan driver crashes (SIGSEGV) when several tests set up a device at
      # once, so lienzo-gpu's tests run one at a time, like ui-egui's integration tests.
      command: "cargo build --workspace --locked --features heif && CARGO_PROFILE_DEV_DEBUG=0 cargo test --workspace --locked --features heif --exclude lienzo-ui-egui --exclude lienzo-gpu && CARGO_PROFILE_DEV_DEBUG=0 cargo test -p lienzo-gpu --locked -- --test-threads=1 && CARGO_PROFILE_DEV_DEBUG=0 cargo test -p lienzo-ui-egui --locked --lib && CARGO_PROFILE_DEV_DEBUG=0 cargo test -p lienzo-ui-egui --locked --doc && CARGO_PROFILE_DEV_DEBUG=0 cargo test -p lienzo-ui-egui --locked --test '*' -- --test-threads=1"

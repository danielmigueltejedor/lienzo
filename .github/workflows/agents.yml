name: AGENTS.md

# AGENTS.md follows Nodalia's template (getnodalia/foundation, standards/agents.md).
on:
  push:
    branches: [nodalia]
    paths:
      - AGENTS.md
      - CLAUDE.md
      - .github/workflows/agents.yml
  pull_request:
    paths:
      - AGENTS.md
      - CLAUDE.md
      - .github/workflows/agents.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agents:
    uses: getnodalia/foundation/.github/workflows/agents-check.yml@976581262c95c0d95c0184149c0e1ba55485ccb3 # foundation main

name: Release from nodalia

# Releases Lienzo when a new version lands on nodalia: bump [workspace.package] version in
# Cargo.toml and add docs/release-notes/vX.Y.Z.md in the same pull request, then merge it.
# Foundation's release-tag tags the merge and drafts the release with those notes, the three
# packaging workflows attach their files, and release-publish publishes it once all of them pass.
# A failed platform leaves the release a draft. Any other push does nothing.
on:
  push:
    branches: [nodalia]

permissions:
  contents: read

concurrency:
  group: release-auto
  cancel-in-progress: false

jobs:
  tag:
    permissions:
      contents: write
    uses: getnodalia/foundation/.github/workflows/release-tag.yml@8ac8b1d9def48c9d33bf762d920afaf5cbfefd75 # foundation 2026-11-13
    with:
      name: Lienzo
      notes-check: scripts/check-release-notes.sh

  linux:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-linux.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}

  macos:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-macos.yml
    # Optional signing secrets: unset, the DMG is signed ad hoc.
    secrets: inherit
    with:
      tag: ${{ needs.tag.outputs.tag }}

  windows:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-windows.yml
    # Optional signing secrets: unset, the files are not signed.
    secrets: inherit
    with:
      tag: ${{ needs.tag.outputs.tag }}

  publish:
    needs: [tag, linux, macos, windows]
    permissions:
      contents: write
    uses: getnodalia/foundation/.github/workflows/release-publish.yml@8ac8b1d9def48c9d33bf762d920afaf5cbfefd75 # foundation 2026-11-13
    with:
      tag: ${{ needs.tag.outputs.tag }}

name: Release from nodalia

# Releases Lienzo when a new version lands on nodalia: bump [workspace.package] version in
# Cargo.toml and add docs/release-notes/vX.Y.Z.md in the same pull request, then merge it.
# Foundation's release-tag tags the merge and drafts the release with those notes, the three
# packaging workflows attach their files, and release-publish publishes it once all of them pass.
# A failed platform leaves the release a draft. Any other push does nothing.
#
# If a platform fails and its fix lands after the tag, run this by hand on nodalia with
# retag-draft: while the release is still a draft, its tag moves to the fixed commit and every
# platform builds again.
on:
  push:
    branches: [nodalia]
  workflow_dispatch:
    inputs:
      retag-draft:
        description: "Move an unpublished draft's tag to this commit and build it again"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-auto
  cancel-in-progress: false

jobs:
  tag:
    permissions:
      contents: write
    uses: getnodalia/foundation/.github/workflows/release-tag.yml@7964f20499fbbe78c855fee7e90d182aff4aae89 # foundation 2026-11-13 (retag-draft)
    with:
      name: Lienzo
      notes-check: scripts/check-release-notes.sh
      retag-draft: ${{ inputs.retag-draft == true }}

  linux:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-linux.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}

  macos:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-macos.yml
    # Optional signing secrets: unset, the DMG is signed ad hoc.
    secrets: inherit
    with:
      tag: ${{ needs.tag.outputs.tag }}

  windows:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-windows.yml
    # Optional signing secrets: unset, the files are not signed.
    secrets: inherit
    with:
      tag: ${{ needs.tag.outputs.tag }}

  publish:
    needs: [tag, linux, macos, windows]
    permissions:
      contents: write
    uses: getnodalia/foundation/.github/workflows/release-publish.yml@7964f20499fbbe78c855fee7e90d182aff4aae89 # foundation 2026-11-13
    with:
      tag: ${{ needs.tag.outputs.tag }}
